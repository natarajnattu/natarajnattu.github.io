<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Pseudocode</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { font-family: sans-serif; }
        #CodeCell textarea { font-size: 14px; }
        #lineNumberBox { font-weight: bold; }
    </style>
</head>
<body onload="testFrame = frames[0]">
    <div class="container-fluid bg-info p-2">
        <div class="row align-items-center">
            <div class="col-md-auto">
                <select id="SamplesList" class="form-control form-control-sm" onchange="loadSample(this.value)">
                    <option value="*">- Sample Programs -</option>
                </select>
            </div>
            <div class="col-md-auto">
                <button class="btn btn-primary btn-sm" onclick="saveProgram()">Save</button>
                <button class="btn btn-secondary btn-sm" onclick="loadProgram()">Load</button>
                <button class="btn btn-success btn-sm" style="width:180px; font-weight:bold" onclick="test()">Run in Box (at right)</button>
                <button class="btn btn-warning btn-sm" onclick="publish()">Run In New Window</button>
                <button class="btn btn-danger btn-sm" onclick="clearTestFrame(testFrame)">Clear Page</button>
                <span class="ml-2">line:</span>
                <span id="lineNumberBox"></span>
            </div>
            <div class="col-md-auto ml-auto text-right">
                <div style="font-family: Arial; font-size: smaller;">
                    <b>= EZ Pseudocode =</b><br>
                    <div style="font-family: TimesRoman; font-size: smaller;">(c) Dave Mulkey 2012</div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid mt-2">
        <div class="row">
            <div class="col-md-6 bg-info p-2">
                <textarea id="tCode" class="form-control" style="width: 100%; height: 550px; font-size: 14px; white-space: pre;" wrap="off" onfocus="this.style.width='100%'"></textarea>
            </div>
            <div class="col-md-6 bg-info p-2">
                <iframe id="viewFrame" title="viewFrame" style="width: 100%; height: 550px;"></iframe>
            </div>
        </div>
    </div>

    <script>
